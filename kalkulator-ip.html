<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator IP</title>
<style>
:root{--bg:#f1f5f6;--card:#fff;--ink:#14213d;--mut:#586377;--line:#dbe3e6;--acc:#0f766e;--accbg:#def3ef;--warn:#9a5a00;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161d;--card:#16212b;--ink:#e6edf3;--mut:#93a1b0;--line:#26333f;--acc:#5fd3c4;--accbg:#183a3a;--warn:#e3a94d;--bad:#ff8a7c}}
:root[data-theme="dark"]{--bg:#0e161d;--card:#16212b;--ink:#e6edf3;--mut:#93a1b0;--line:#26333f;--acc:#5fd3c4;--accbg:#183a3a;--warn:#e3a94d;--bad:#ff8a7c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:600;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);box-sizing:border-box}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{cursor:pointer}
.mut{color:var(--mut);font-size:14px}
.hero{padding:16px 16px 10px}
.ip{font-size:52px;font-weight:600;line-height:1.1;color:var(--acc)}
.bar{height:6px;border-radius:3px;background:var(--line);margin:0 16px 14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:12px;margin:0 16px 10px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:600}
.head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:none;border:0;text-align:left;min-height:56px}
.badge{min-width:40px;text-align:center;padding:4px 10px;border-radius:999px;background:var(--accbg);color:var(--acc);font-weight:600}
.body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
.open .body{display:block}
.row2{display:grid;grid-template-columns:1fr 84px;gap:8px;margin-top:12px}
.fl{display:block;font-size:13px;color:var(--mut)}
.fl input,.fl select{margin-top:4px;color:var(--ink);font-size:16px}
.cp{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.r1{display:grid;grid-template-columns:1fr 84px 44px;gap:8px}
.wb{position:relative}.wb span{position:absolute;right:10px;top:10px;color:var(--mut)}.wb input{padding-right:26px}
.r2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}
.av{min-width:72px;text-align:right;font-weight:600}
.x{border:0;background:none;color:var(--mut);font-size:22px;border-radius:10px;min-height:44px}
.btn{width:100%;min-height:44px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--acc);margin-top:12px}
.danger{color:var(--bad)}
.note{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--accbg);font-size:14px}
.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
summary{padding:14px 16px;cursor:pointer;min-height:44px;box-sizing:border-box}
.cut{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 8px}
</style>
</head>
<body>
<div class="wrap">
<h1>Kalkulator IP</h1>
<div class="card">
<div class="hero"><div class="mut">Indeks Prestasi (IP)</div><div class="ip" id="ip">–</div><div class="mut" id="sks"></div></div>
<div class="bar" aria-hidden="true"><i id="bar"></i></div>
<div class="seg" role="group" aria-label="Mode hitung"><button data-m="now">Saat ini</button><button data-m="proj">Proyeksi</button></div>
<p class="mut" id="hint" style="margin:0;padding:0 16px 14px"></p>
</div>
<div id="list"></div>
<button class="btn" id="add" style="margin:0 0 12px">+ Tambah mata kuliah</button>
<details class="card"><summary>Batas nilai huruf</summary><div class="cut" id="cuts"></div><p class="mut" style="margin:0;padding:0 16px 16px">Batas tiap dosen bisa berbeda. Angka bawaan hanya perkiraan, samakan dengan ketentuan mata kuliahmu.</p></details>
<button class="btn" id="reset" style="margin:0 0 12px">Reset ke data awal</button>
<p class="mut">Data tersimpan di browser ini saja dan tidak dikirim ke mana pun.</p>
</div>
<script>
const KEY='ip-calc-v1',L=['A','AB','B','BC','C','D'],PTS={A:4,AB:3.5,B:3,BC:2.5,C:2,D:1,E:0};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const num=v=>parseFloat(String(v).replace(',','.'));
const f=(n,d=2)=>n.toFixed(d).replace('.',',');
const mk=a=>a.map(x=>({id:uid(),...x}));
const tpl=()=>mk([{n:'Tugas',w:30,s:''},{n:'UTS',w:35,s:''},{n:'UAS',w:35,s:''}]);
function seed(){const m=(n,k,c)=>({id:uid(),n,k,l:'auto',t:'A',c});
return{mode:'now',cut:{A:80,AB:72,B:64,BC:56,C:48,D:40},courses:[
m('Matematika Dasar 1',4,mk([{n:'PKH',w:10,s:'86,66666667 72 80 80 90'},{n:'KBF',w:10,s:'53,33333333 50'},{n:'UTS',w:35,s:'86,04651163'},{n:'UAS',w:35,s:'82'},{n:'Proyek Mini',w:10,s:'80'}])),
m('Kimia Dasar 1',3,tpl()),m('Fisika Dasar 1',4,tpl())]}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.courses)&&d.cut)return d}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),open={};
if(S.courses[0])open[S.courses[0].id]=true;
function avg(s){const a=String(s).split(/[\s;]+/).filter(Boolean).map(num).filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function calc(c){let col=0,fw=0,tw=0,rw=0,rem=[];
c.c.forEach(p=>{const w=num(p.w)||0,a=avg(p.s);tw+=w;if(a===null){rw+=w;rem.push(p.n||'tanpa nama')}else{col+=w*a/100;fw+=w}});
const has=fw>0&&tw>0;
return{col,fw,tw,rw,rem,has,fin:has?(S.mode==='proj'?col*100/fw:col*100/tw):null}}
const cutOf=l=>num(S.cut[l]);
function letter(x){for(const l of L)if(x>=cutOf(l))return l;return'E'}
function grade(c,r){return c.l!=='auto'?c.l:(r.has?letter(r.fin):null)}
function ip(){let a=0,b=0;S.courses.forEach(c=>{const g=grade(c,calc(c)),k=num(c.k)||0;if(g&&k>0){a+=k*PTS[g];b+=k}});return{v:b?a/b:null,sks:b}}
function need(c,r){const t=c.t||'A',cut=cutOf(t);
if(!Number.isFinite(cut))return'Isi batas nilai huruf dulu.';
if(!r.tw)return'Isi bobot komponen dulu.';
if(r.rw===0){const fin=r.col*100/r.tw;return fin>=cut?`Semua komponen terisi. Target ${t} tercapai.`:`Semua komponen terisi. Target ${t} belum tercapai, kurang ${f(cut-fin)} poin.`}
const x=(cut*r.tw/100-r.col)*100/r.rw,who=r.rem.join(', ');
if(x<=0)return`Target ${t} sudah pasti tercapai, berapa pun nilai ${who}.`;
if(x>100)return`Target ${t} tidak mungkin tercapai, butuh rata-rata ${f(x,1)} di ${who}.`;
return`Untuk ${t}, butuh rata-rata minimal ${f(x,1)} di ${who}.`}
const opts=(a,s)=>a.map(v=>`<option${v===s?' selected':''}>${v}</option>`).join('');
function courseHTML(c){return`<section class="card${open[c.id]?' open':''}" data-id="${c.id}">
<button class="head" data-act="toggle" aria-expanded="${!!open[c.id]}"><span><b data-t></b><br><span class="mut" data-sk></span></span><span style="display:flex;gap:10px;align-items:center"><span class="mut" data-fin></span><span class="badge" data-g>–</span></span></button>
<div class="body">
<div class="row2"><label class="fl">Nama mata kuliah<input data-f="n" value="${esc(c.n)}"></label><label class="fl">SKS<input data-f="k" inputmode="decimal" value="${esc(c.k)}"></label></div>
${c.c.map(p=>`<div class="cp" data-cid="${p.id}"><div class="r1"><input data-f="pn" aria-label="Nama komponen" placeholder="Nama komponen" value="${esc(p.n)}"><div class="wb"><input data-f="pw" aria-label="Bobot dalam persen" inputmode="decimal" value="${esc(p.w)}"><span>%</span></div><button class="x" data-act="delp" aria-label="Hapus komponen">×</button></div>
<div class="r2"><input data-f="ps" aria-label="Nilai komponen" placeholder="Nilai, pisahkan dengan spasi" value="${esc(p.s)}"><span class="av" data-avg></span></div></div>`).join('')}
<button class="btn" data-act="addp">+ Tambah komponen</button>
<p class="mut" style="margin:8px 0 0" data-sum></p>
<div class="grid2"><label class="fl">Target huruf<select data-f="t">${opts(L,c.t)}</select></label><label class="fl">Huruf resmi (opsional)<select data-f="l"><option value="auto"${c.l==='auto'?' selected':''}>Otomatis</option>${opts([...L,'E'],c.l)}</select></label></div>
<p class="note" data-need></p>
<button class="btn danger" data-act="delc">Hapus mata kuliah</button>
</div></section>`}
function upd(card){const c=S.courses.find(x=>x.id===card.dataset.id),r=calc(c),g=grade(c,r);
card.querySelector('[data-t]').textContent=c.n||'Tanpa nama';
card.querySelector('[data-sk]').textContent=`${c.k||0} SKS`;
card.querySelector('[data-fin]').textContent=r.has?f(r.fin):'';
card.querySelector('[data-g]').textContent=g||'–';
card.querySelectorAll('.cp').forEach(e=>{const p=c.c.find(x=>x.id===e.dataset.cid),a=avg(p.s);e.querySelector('[data-avg]').textContent=a===null?'belum ada':f(a)});
const s=card.querySelector('[data-sum]');s.className='mut'+(r.tw!==100?' warn':'');
s.textContent=`Total bobot ${f(r.tw,r.tw%1?1:0)}%`+(r.tw!==100?', idealnya 100%.':'.')+(r.has?` Terkumpul ${f(r.col)} poin.`:'');
card.querySelector('[data-need]').textContent=need(c,r)}
function refresh(){document.querySelectorAll('#list .card').forEach(upd);
const o=ip();$('#ip').textContent=o.v===null?'–':f(o.v);
$('#bar').style.width=o.v===null?'0':Math.min(100,o.v/4*100)+'%';
$('#sks').textContent=o.sks?`dari ${f(o.sks,o.sks%1?1:0)} SKS yang sudah bernilai`:'Belum ada mata kuliah bernilai';
document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S.mode));
$('#hint').textContent=S.mode==='proj'?'Komponen yang masih kosong dianggap sama dengan rata-rata nilaimu sekarang.':'Komponen yang masih kosong dihitung 0.';
save()}
function render(){$('#list').innerHTML=S.courses.length?S.courses.map(courseHTML).join(''):'<p class="mut">Belum ada mata kuliah. Ketuk Tambah mata kuliah di bawah.</p>';
$('#cuts').innerHTML=L.map(l=>`<label class="fl">${l} mulai dari<input inputmode="decimal" data-cut="${l}" value="${esc(S.cut[l])}"></label>`).join('');
refresh()}
function arm(b,txt){if(b.dataset.arm)return true;b.dataset.arm=1;const o=b.textContent;b.textContent=txt;setTimeout(()=>{delete b.dataset.arm;b.textContent=o},3000);return false}
$('#list').addEventListener('input',e=>{const t=e.target,k=t.dataset.f;if(!k)return;
const c=S.courses.find(x=>x.id===t.closest('.card').dataset.id);
if(k[0]==='p'){c.c.find(x=>x.id===t.closest('.cp').dataset.cid)[k[1]]=t.value}else c[k]=t.value;
refresh()});
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
const card=b.closest('.card'),c=S.courses.find(x=>x.id===card.dataset.id),a=b.dataset.act;
if(a==='toggle'){open[c.id]=!open[c.id];card.classList.toggle('open');b.setAttribute('aria-expanded',!!open[c.id])}
else if(a==='addp'){c.c.push({id:uid(),n:'',w:0,s:''});render()}
else if(a==='delp'){c.c=c.c.filter(x=>x.id!==b.closest('.cp').dataset.cid);render()}
else if(a==='delc'&&arm(b,'Yakin? Ketuk lagi')){S.courses=S.courses.filter(x=>x!==c);render()}});
$('#add').onclick=()=>{const c={id:uid(),n:'Mata kuliah baru',k:3,l:'auto',t:'A',c:tpl()};S.courses.push(c);open[c.id]=true;render()};
$('#reset').onclick=e=>{if(arm(e.currentTarget,'Yakin? Ketuk lagi')){S=seed();open={};open[S.courses[0].id]=true;render()}};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;refresh()});
$('#cuts').addEventListener('input',e=>{const l=e.target.dataset.cut;if(l){S.cut[l]=e.target.value;refresh()}});
render();
</script>
</body>
</html>
